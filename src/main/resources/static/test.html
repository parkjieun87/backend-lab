<!DOCTYPE html>
<html>
<head>
    <!-- SockJS: 웹소켓을 못 쓰는 환경에서도 동작하게 해주는 클라이언트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <!-- Stomp.js: STOMP 프로토콜(구독/발행 방식)을 웹소켓 위에서 쓰게 해주는 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h3>Room: test-room-1</h3>
<ul id="log"></ul>

<script>
    // 1. /ws 엔드포인트로 웹소켓 연결 시도 (서버의 WebSocketConfig에서 등록한 그 주소)
    const stompClient = Stomp.over(new SockJS('/ws'));

    // 2. 연결 성공하면 콜백 실행
    stompClient.connect({}, () => {
        console.log('WebSocket connected');

        // 3. "/topic/room/test-room-1" 채널을 구독
        //    -> 서버가 NotificationDispatcher에서 이 주소로 보낸 메시지를 여기서 받음
        stompClient.subscribe('/topic/room/test-room-1', (msg) => {
            const data = JSON.parse(msg.body);
            const li = document.createElement('li');
            li.textContent = `signal received: messageId=${data.messageId}`;
            document.getElementById('log').appendChild(li);
        });
    });
</script>
</body>
</html>
