spring:
  application:
    name: messenger-server
  datasource:
    url: jdbc:mariadb://localhost:3306/messenger
    username: messenger
    password: messenger
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 docker/mariadb/init/01-schema.sql이 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug                       # 5단계: "DB를 안 타는지" 확인용
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: debug            # 1단계: 세션/필터 흐름 확인용
